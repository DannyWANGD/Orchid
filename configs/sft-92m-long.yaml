model: configs/model-92m.yaml
data: configs/data.yaml
task: configs/task.yaml
seed: 2026
runtime: {device: cuda, precision: bf16, deterministic: false, cpu_threads: 2, fp32_matmul_precision: highest}
training:
  epochs: 30
  micro_batch: 32
  accumulation: 1
  lr: 0.00015  # longer schedule, smaller peak learning rate
  min_lr_fraction: 0.1
  warmup_fraction: 0.03
  weight_decay: 0.1
  betas: [0.9, 0.95]
  eps: 1.0e-8
  grad_clip: 1.0
  eval_every: 0
  patience: 3
  min_improvement: 0.0001
supervision:
  whitelist: data/lexicon/imagery.txt
  stopwords: data/lexicon/stopwords.txt
  min_train_poems: 2
  seed: 2026
sampling:
  temperature: 0.8
  top_k: 50
  top_p: 1.0
  max_new_tokens: 64
  seed: 11
  validation_count: 30
